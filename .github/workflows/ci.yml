name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run python scripts/gen_async.py --check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run python -c "import sys; print(sys.version)"
      # Integration tests skip themselves: TELE_API_URL and the key are not set in CI.
      - run: uv run pytest -ra
      - name: Core package imports without FastAPI
        run: |
          uv venv /tmp/core --python ${{ matrix.python }}
          uv pip install --python /tmp/core .
          /tmp/core/bin/python -c "import tele_fastapi; from tele_fastapi import TeleClient, AsyncTeleClient, TeleSigner"
